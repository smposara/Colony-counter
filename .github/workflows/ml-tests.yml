name: ml-tests

on:
  push:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "ml[dev]"
      - run: pytest ml
