name: colony_counter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.3.0
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  idb_shim: ^2.9.10
  image: ^4.10.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the web version never needs to download fonts at run time.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: ColonySymbols
      fonts:
        - asset: assets/fonts/ColonySymbols-Regular.ttf
