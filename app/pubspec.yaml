name: colony_counter
description: "Colony Counter: count colonies (CFU) on agar plates with a phone camera."
publish_to: 'none'
version: 0.7.1+12

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.3.0
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  idb_shim: ^2.9.10
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: any
  path_provider: ^2.1.6
  pdf: ^3.13.1
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Licence texts of the bundled fonts, shown under About → Open-source licences.
  assets:
    - assets/fonts/LICENSE-Roboto.txt
    - assets/fonts/LICENSE-IBMPlexSansThai.txt
    - assets/fonts/LICENSE-ColonySymbols.txt
    # The app icon, shown on the About page.
    - assets/icon/icon-256.png

  # Bundled so the web version never needs to download fonts at run time.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # Thai script (the Thai subset of IBM Plex Sans Thai, OFL).
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    - family: ColonySymbols
      fonts:
        - asset: assets/fonts/ColonySymbols-Regular.ttf
