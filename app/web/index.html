<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    "./" lets the app run from any folder on a web server, e.g.
    https://example.org/ or https://example.org/tools/colony-counter/.
    The app uses #-style page addresses, so no server rewrite rules are needed.
  -->
  <base href="./">
  <meta charset="UTF-8">
<!-- Google Analytics (web version only): page views and general visit statistics. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R9XQF5R5RW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-R9XQF5R5RW', { allow_google_signals: false, allow_ad_personalization_signals: false });
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Count bacterial colonies (CFU) on agar plates from a phone photo and calculate CFU/mL.">
  <meta name="theme-color" content="#1565C0">

  <!-- iPhone: "Add to Home Screen" opens full-screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Colonies">
  <link rel="apple-touch-icon" href="app-icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Colony Counter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f8f9ff; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 16px -apple-system, system-ui, sans-serif; color: #1565C0;
    }
    #loading .ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #d6e3ff; border-top-color: #FF9800;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="ring"></div>Loading Colony Counter…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline use: offline_sw.js (made when packaging) keeps the app's files
    // in the browser after the first visit. A newer version found on an
    // earlier visit takes over now, at launch, never while the app is in use.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('offline_sw.js').then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) {
          navigator.serviceWorker.addEventListener('controllerchange',
            function () { location.reload(); }, { once: true });
          reg.waiting.postMessage('skipWaiting');
        }
      }).catch(function () {});
    }
  </script>
</body>
</html>
