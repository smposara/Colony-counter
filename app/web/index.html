<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    "./" lets the app run from any folder on a web server, e.g.
    https://example.org/ or https://example.org/tools/colony-counter/.
    The app uses #-style page addresses, so no server rewrite rules are needed.
  -->
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Count bacterial colonies (CFU) on agar plates from a phone photo and calculate CFU/mL.">
  <meta name="theme-color" content="#1565C0">

  <!-- iPhone: "Add to Home Screen" opens full-screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Colonies">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Colony Counter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f8f9ff; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 16px -apple-system, system-ui, sans-serif; color: #1565C0;
    }
    #loading .ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #d6e3ff; border-top-color: #FF9800;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="ring"></div>Loading Colony Counter…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
