[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colonycounter"
version = "0.1.0"
description = "Reference pipeline for counting CFUs on agar plate photos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
colonycounter = "colonycounter.cli:main"

[tool.setuptools.packages.find]
include = ["colonycounter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
