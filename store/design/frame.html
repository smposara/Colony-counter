<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Play Store phone screenshot: 1080 × 1920, a headline over a phone showing
   a real app screen. Parameters come from the URL (see make_graphics.js). */
@font-face { font-family: Roboto; src: url(../../app/assets/fonts/Roboto-Regular.ttf); }
@font-face { font-family: Roboto; font-weight: 500; src: url(../../app/assets/fonts/Roboto-Medium.ttf); }
@font-face { font-family: Roboto; font-weight: 700; src: url(../../app/assets/fonts/Roboto-Bold.ttf); }
@font-face { font-family: PlexThai; src: url(../../app/assets/fonts/IBMPlexSansThai-Regular.ttf); }
@font-face { font-family: PlexThai; font-weight: 500; src: url(../../app/assets/fonts/IBMPlexSansThai-Medium.ttf); }
@font-face { font-family: PlexThai; font-weight: 700; src: url(../../app/assets/fonts/IBMPlexSansThai-Bold.ttf); }
@font-face { font-family: Sym; src: url(../../app/assets/fonts/ColonySymbols-Regular.ttf); }
:root { --blue: #1565c0; --blue-deep: #0d4a94; --orange: #ff9800; --frame: #0f151f; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: Roboto, PlexThai, Sym, sans-serif; color: #fff;
  background: radial-gradient(120% 70% at 50% 0%, #1e74d6 0%, var(--blue) 45%, var(--blue-deep) 100%); }
.head { position: absolute; top: 96px; left: 80px; right: 80px; text-align: center; }
.bar { width: 96px; height: 10px; border-radius: 5px; background: var(--orange); margin: 0 auto 36px; }
h1 { font-size: 78px; line-height: 1.12; font-weight: 700; letter-spacing: -0.5px; }
p { margin-top: 22px; font-size: 40px; line-height: 1.3; font-weight: 400; opacity: .9; }
:lang(th) h1 { font-size: 74px; line-height: 1.25; }
.phone { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
  width: 640px; padding: 20px; border-radius: 66px; background: var(--frame);
  box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 0 0 3px #2a3442; }
.phone img { display: block; width: 100%; border-radius: 48px; }
.note { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
  font-size: 22px; opacity: .85; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
</style></head>
<body>
<div class="head"><div class="bar"></div><h1 id="h"></h1><p id="s"></p></div>
<div class="phone"><img id="img" alt=""></div>
<div class="note" id="n"></div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.lang = q.get('lang') || 'en';
document.getElementById('h').textContent = q.get('h');
document.getElementById('s').textContent = q.get('s') || '';
document.getElementById('n').textContent = q.get('n') || '';
document.getElementById('img').src = q.get('img');
</script>
</body></html>
