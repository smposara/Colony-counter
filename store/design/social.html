<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Facebook launch images. ?kind=square (1080 × 1080 feed post),
   link (1200 × 630 link preview) or features (1080 × 1080 feature grid). */
@font-face { font-family: Roboto; font-weight: 700; src: url(../../app/assets/fonts/Roboto-Bold.ttf); }
@font-face { font-family: Roboto; src: url(../../app/assets/fonts/Roboto-Regular.ttf); }
@font-face { font-family: PlexThai; font-weight: 700; src: url(../../app/assets/fonts/IBMPlexSansThai-Bold.ttf); }
@font-face { font-family: PlexThai; src: url(../../app/assets/fonts/IBMPlexSansThai-Regular.ttf); }
@font-face { font-family: Sym; src: url(../../app/assets/fonts/ColonySymbols-Regular.ttf); }
* { margin: 0; box-sizing: border-box; }
html, body { overflow: hidden; }
body { font-family: Roboto, PlexThai, Sym, sans-serif; color: #fff; position: relative;
  background: radial-gradient(90% 110% at 15% 10%, #1e74d6 0%, #1565c0 50%, #0d4a94 100%); }
.square, .features { width: 1080px; height: 1080px; }
.link { width: 1200px; height: 630px; }

.badge { display: inline-block; background: #ff9800; color: #2b1700; font-weight: 700;
  border-radius: 999px; padding: 10px 26px; font-size: 30px; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.brand b { font-size: 46px; }
h1 { font-weight: 700; line-height: 1.12; text-wrap: balance; }
:lang(th) h1 { line-height: 1.3; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips span { border: 2px solid rgba(255,255,255,.55); border-radius: 999px; padding: 4px 16px 6px;
  font-size: 22px; line-height: 1.35; }
.get { font-size: 23px; line-height: 1.5; opacity: .95; }
.get b { color: #ffcc80; }
.note { position: absolute; font-size: 14px; opacity: .7; }
.phone { position: absolute; padding: 9px; border-radius: 32px; background: #0f151f;
  box-shadow: 0 18px 44px rgba(0,0,0,.45); }
.phone img { display: block; width: 100%; border-radius: 24px; }

/* Square feed post */
.square .top { position: absolute; left: 64px; right: 64px; top: 56px;
  display: flex; flex-direction: column; gap: 22px; }
.square h1 { font-size: 58px; }
:lang(th) .square h1 { font-size: 54px; }
.square .phone { width: 300px; }
.square .p1 { left: 70px; top: 640px; transform: rotate(-7deg); }
.square .p2 { left: 390px; top: 600px; z-index: 2; }
.square .p3 { left: 710px; top: 640px; transform: rotate(7deg); }
.square .note { left: 0; right: 0; bottom: 0; padding: 14px 64px; text-align: center; z-index: 3;
  background: #0b3c78; opacity: 1; color: rgba(255,255,255,.75); }

/* Link preview */
.link .left { position: absolute; left: 56px; top: 0; bottom: 0; width: 640px;
  display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.link .badge { font-size: 24px; padding: 8px 20px; align-self: flex-start; }
.link .brand img { width: 72px; height: 72px; }
.link .brand b { font-size: 40px; }
.link h1 { font-size: 44px; }
:lang(th) .link h1 { font-size: 40px; }
.link .get { font-size: 21px; }
.link .phone { width: 230px; }
.link .p1 { left: 745px; top: 90px; transform: rotate(-6deg); }
.link .p2 { left: 935px; top: 50px; transform: rotate(5deg); }
.link .note { left: 56px; bottom: 14px; font-size: 13px; }

/* Feature grid */
.features .head { position: absolute; left: 60px; right: 60px; top: 48px;
  display: flex; align-items: center; justify-content: space-between; }
.features h1 { font-size: 50px; }
.features .brand img { width: 64px; height: 64px; border-radius: 16px; }
.features .brand b { font-size: 32px; }
.grid { position: absolute; left: 60px; right: 60px; top: 150px; bottom: 60px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 22px; }
.tile { background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.22);
  border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
.tile .shot { flex: 1; overflow: hidden; margin: 14px 14px 0; border-radius: 16px 16px 0 0; }
.tile .shot img { display: block; width: 100%; }
.tile b { display: block; padding: 12px 16px 14px; font-size: 24px; line-height: 1.25;
  background: #fff; color: #0d3c73; min-height: 82px; display: flex; align-items: center;
  white-space: pre-line; }
.features .note { left: 60px; right: 60px; bottom: 20px; text-align: center; }
</style></head>
<body>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get('kind'), lang = q.get('lang');
document.documentElement.lang = lang;
document.body.className = kind;
const T = JSON.parse(q.get('text'));
const shot = n => q.get('img' + n);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const brand = `<div class="brand"><img src="../../app/assets/icon/icon-256.png" alt=""><b>Colony Counter</b></div>`;
const note = `<div class="note">${esc(T.note)}</div>`;
const get = `<div class="get">${T.get.map(([k, v]) => `<b>${esc(k)}</b> ${esc(v)}`).join('<br>')}</div>`;
let html = '';
if (kind === 'square') {
  html = `<div class="top"><div><span class="badge">${esc(T.badge)}</span></div>${brand}
    <h1>${esc(T.h)}</h1><div class="chips">${T.chips.map(c => `<span>${esc(c)}</span>`).join('')}</div>${get}</div>
    ${[1, 2, 3].map(n => `<div class="phone p${n}"><img src="${shot(n)}" alt=""></div>`).join('')}${note}`;
} else if (kind === 'link') {
  html = `<div class="left"><span class="badge">${esc(T.badge)}</span>${brand}<h1>${esc(T.h)}</h1>${get}</div>
    ${[1, 2].map(n => `<div class="phone p${n}"><img src="${shot(n)}" alt=""></div>`).join('')}${note}`;
} else {
  html = `<div class="head"><h1>${esc(T.h)}</h1>${brand}</div>
    <div class="grid">${T.tiles.map((t, i) => `<div class="tile"><div class="shot"><img src="${shot(i + 1)}" alt=""></div><b>${esc(t)}</b></div>`).join('')}</div>${note}`;
}
document.body.innerHTML = html;
</script>
</body></html>
